# ---------------------------------------------------------------------------
# The console: what WE run. Traefik fronts every session; sessions attach to
# the same network so Traefik can reach them, and disappear when destroyed.
# ---------------------------------------------------------------------------
name: sb-console

services:
  traefik:
    image: traefik:v3.3
    container_name: sb-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sb_sessions
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "${TRAEFIK_HTTP_PORT:-8088}:80"
      - "8089:8080"                       # dashboard, lab only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sessions]
    restart: unless-stopped

  session-manager:
    build: ./session-manager
    container_name: sb-session-manager
    environment:
      PROJECT_DIR: /project
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env}
      LAB_DOMAIN: ${LAB_DOMAIN:-sb.test}
      TRAEFIK_HTTP_PORT: ${TRAEFIK_HTTP_PORT:-8088}
    volumes:
      # The session manager's power comes entirely from these two mounts. In production
      # this is the container that needs the most protecting.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project
    labels:
      - traefik.enable=true
      - traefik.docker.network=sb_sessions
      - traefik.http.routers.session-manager.rule=Host(`console.${LAB_DOMAIN:-sb.test}`)
      - traefik.http.routers.session-manager.entrypoints=web
      # Every request to the console is checked by authentik first.
      - traefik.http.routers.session-manager.middlewares=ak-auth@docker
      - traefik.http.services.session-manager.loadbalancer.server.port=8000
    networks: [sessions]
    restart: unless-stopped

networks:
  sessions:
    name: sb_sessions
